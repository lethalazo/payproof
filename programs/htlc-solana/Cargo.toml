[package]
name = "htlc-solana"
version = "0.1.0"
description = "HTLC Hash Time-Locked Contract for Solana SPL tokens"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "htlc_solana"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

[profile.release]
overflow-checks = true
