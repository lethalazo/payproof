<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Three circles: purple (top-left), green (top-right), orange (bottom-center) -->
  <circle cx="10" cy="9" r="5" fill="#8B5CF6"/>
  <circle cx="30" cy="9" r="5" fill="#10B981"/>
  <circle cx="20" cy="30" r="5" fill="#F97316"/>
  <!-- Arcs connecting circle edges -->
  <!-- Purple right edge (15,9) → Green left edge (25,9), curves up -->
  <path d="M 15 9 Q 20 2 25 9" stroke="#8B5CF6" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
  <!-- Purple bottom (12.1,13.3) → Orange top-left (17.9,25.7), curves left -->
  <path d="M 12.1 13.3 Q 6.5 20 17.9 25.7" stroke="#F97316" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
  <!-- Green bottom (27.9,13.3) → Orange top-right (22.1,25.7), curves right -->
  <path d="M 27.9 13.3 Q 33.5 20 22.1 25.7" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
</svg>
