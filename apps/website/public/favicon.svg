<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Three circles: purple (top-left), green (top-right), orange (bottom-center) -->
  <circle cx="8" cy="7" r="4" fill="#8B5CF6"/>
  <circle cx="24" cy="7" r="4" fill="#10B981"/>
  <circle cx="16" cy="24" r="4" fill="#F97316"/>
  <!-- Arcs connecting circle edges -->
  <!-- Purple right edge (12,7) → Green left edge (20,7), curves up -->
  <path d="M 12 7 Q 16 1.5 20 7" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <!-- Purple bottom (9.7,10.6) → Orange top-left (14.3,20.4), curves left -->
  <path d="M 9.7 10.6 Q 5.5 16 14.3 20.4" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <!-- Green bottom (22.3,10.6) → Orange top-right (17.7,20.4), curves right -->
  <path d="M 22.3 10.6 Q 26.5 16 17.7 20.4" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
</svg>
