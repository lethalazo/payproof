<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#FAF8F5"/>
  <!-- Gradient orbs -->
  <circle cx="200" cy="150" r="200" fill="#6366F1" opacity="0.08"/>
  <circle cx="1000" cy="500" r="250" fill="#8B5CF6" opacity="0.06"/>
  <circle cx="600" cy="600" r="180" fill="#10B981" opacity="0.06"/>
  <!-- Wordmark -->
  <text x="600" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="72" fill="#1A1A1A">Payproof</text>
  <!-- Tagline -->
  <text x="600" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="28" fill="#6B6560">The Trustless Payment Protocol for Autonomous Agents</text>
  <!-- Subline -->
  <text x="600" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" fill="#6B6560" opacity="0.7">Atomic. Non-custodial. Permissionless.</text>
  <!-- Protocol colors bar -->
  <rect x="400" y="440" width="80" height="4" rx="2" fill="#6366F1"/>
  <rect x="490" y="440" width="80" height="4" rx="2" fill="#F97316"/>
  <rect x="580" y="440" width="80" height="4" rx="2" fill="#0EA5E9"/>
  <rect x="670" y="440" width="80" height="4" rx="2" fill="#10B981"/>
  <rect x="760" y="440" width="80" height="4" rx="2" fill="#8B5CF6"/>
  <!-- Built on -->
  <text x="600" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="16" fill="#6B6560" opacity="0.5">Built on Circle USDC · Arc · x402</text>
  <!-- URL -->
  <text x="600" y="570" text-anchor="middle" font-family="monospace" font-weight="400" font-size="16" fill="#6B6560" opacity="0.4">payproof.so</text>
</svg>
